services:
  # Hyperledger Besu Node 1 (Validator)
  besu-node1:
    image: hyperledger/besu:latest
    container_name: salf-besu-node1
    command:
      - --config-file=/config/config.toml
    volumes:
      - ./blockchain/besu/node1:/opt/besu/data
      - ./blockchain/besu/config:/config
    ports:
      - "8545:8545" # HTTP RPC
      - "8546:8546" # WebSocket RPC
      - "30303:30303" # P2P
    networks:
      - salf-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Hyperledger Besu Node 2 (Validator)
  besu-node2:
    image: hyperledger/besu:latest
    container_name: salf-besu-node2
    command:
      - --config-file=/config/config.toml
      - --bootnodes=enode://BOOTNODE_ENODE_URL
    volumes:
      - ./blockchain/besu/node2:/opt/besu/data
      - ./blockchain/besu/config:/config
    ports:
      - "8547:8545"
      - "8548:8546"
      - "30304:30303"
    networks:
      - salf-network
    depends_on:
      - besu-node1

  # IPFS Node
  ipfs:
    image: ipfs/kubo:latest
    container_name: salf-ipfs
    volumes:
      - ./ipfs/data:/data/ipfs
      - ./ipfs/staging:/staging
    ports:
      - "4001:4001" # P2P
      - "5001:5001" # API
      - "8080:8080" # Gateway
    environment:
      - IPFS_PROFILE=server
    networks:
      - salf-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: salf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salf_password}
      POSTGRES_DB: ${POSTGRES_DB:-salf_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - salf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salf_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: salf-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - salf-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: salf-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-salf_user}:${POSTGRES_PASSWORD:-salf_password}@postgres:5432/${POSTGRES_DB:-salf_db}
      - REDIS_URL=redis://redis:6379
      - BESU_RPC_URL=http://besu-node1:8545
      - BESU_CHAIN_ID=${BESU_CHAIN_ID:-1337}
      - BESU_PRIVATE_KEY=${BESU_PRIVATE_KEY:-}
      - ACCESS_CONTROL_ADDRESS=${ACCESS_CONTROL_ADDRESS:-}
      - ACADEMIC_CREDIT_ADDRESS=${ACADEMIC_CREDIT_ADDRESS:-}
      - CONTRIBUTION_REGISTRY_ADDRESS=${CONTRIBUTION_REGISTRY_ADDRESS:-}
      - IPFS_API_URL=http://ipfs:5001
      - IPFS_GATEWAY_URL=http://ipfs:8080
      - SECRET_KEY=${JWT_SECRET:-your-secret-key-change-in-production}
      - DEBUG=false
    volumes:
      - ../backend:/app
      - ml_models:/app/ml_models
    ports:
      - "8000:8000"
    networks:
      - salf-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      besu-node1:
        condition: service_healthy
      ipfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # React Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: salf-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_CHAIN_ID=0x539
      - VITE_RPC_URL=http://localhost:8545
    ports:
      - "3000:80"
    networks:
      - salf-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: salf-nginx
    volumes:
      - ./observability/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../report-dashboard.html:/usr/share/nginx/html/report-dashboard.html:ro
      - ../report-assets:/usr/share/nginx/html/report-assets:ro
    ports:
      - "80:80"
    networks:
      - salf-network
    depends_on:
      - frontend
      - grafana

  # ML Model Service (Sentence-BERT)
  ml-service:
    build:
      context: ../ml
      dockerfile: Dockerfile
    container_name: salf-ml-service
    environment:
      - MODEL_NAME=all-MiniLM-L6-v2
      - DEVICE=cpu
    volumes:
      - ml_models:/models
    ports:
      - "8001:8001"
    networks:
      - salf-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: salf-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - salf-network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: salf-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - salf-network
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.1.1
    container_name: salf-loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - salf-network

  promtail:
    image: grafana/promtail:3.1.1
    container_name: salf-promtail
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - salf-network
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: salf-node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - salf-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: salf-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8088:8080"
    networks:
      - salf-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: salf-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - salf-network

networks:
  salf-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ml_models:
  prometheus_data:
  grafana_data:
  loki_data:
