events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_forwarded_proto $proxy_forwarded_proto {
        default $scheme;
        https https;
        http http;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    upstream salf_frontend {
        server frontend:80;
    }

    upstream salf_grafana {
        server grafana:3000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location = /report {
            root /usr/share/nginx/html;
            try_files /report-dashboard.html =404;
        }

        location /report-assets/ {
            alias /usr/share/nginx/html/report-assets/;
            expires 1h;
            add_header Cache-Control "public";
        }

        location /grafana/ {
            rewrite ^/grafana/(.*) /$1 break;
            proxy_pass http://salf_grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_redirect off;
        }

        location /grafana/api/live/ {
            rewrite ^/grafana/(.*) /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass http://salf_grafana;
        }

        location = /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://salf_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
