global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: salf-backend
    metrics_path: /prometheus
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: salf-ml-service
    metrics_path: /prometheus
    static_configs:
      - targets: ["host.docker.internal:8001"]
